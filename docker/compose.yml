services:
  # ─── E-Commerce Core ───────────────────────────────────
  order-service:
    profiles: ["core", "all"]
    build:
      context: ..
      dockerfile: order-service/Dockerfile
    container_name: order-service
    ports:
      - "8081:8081"
    env_file:
      - ../.env
    environment:
      NEON_HOST: ${NEON_HOST}
      NEON_USER: ${NEON_USER}
      NEON_PASSWORD: ${NEON_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_USERNAME: ${KAFKA_USERNAME}
      KAFKA_PASSWORD: ${KAFKA_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_USERNAME: ${REDIS_USERNAME}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    mem_limit: 350m
    networks:
      - eventflow-net
    restart: unless-stopped

  payment-service:
    profiles: ["core", "all"]
    build:
      context: ..
      dockerfile: payment-service/Dockerfile
    container_name: payment-service
    ports:
      - "8082:8082"
    env_file:
      - ../.env
    environment:
      NEON_HOST: ${NEON_HOST}
      NEON_USER: ${NEON_USER}
      NEON_PASSWORD: ${NEON_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_USERNAME: ${KAFKA_USERNAME}
      KAFKA_PASSWORD: ${KAFKA_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_USERNAME: ${REDIS_USERNAME}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    mem_limit: 350m
    networks:
      - eventflow-net
    restart: unless-stopped

  inventory-service:
    profiles: ["core", "all"]
    build:
      context: ..
      dockerfile: inventory-service/Dockerfile
    container_name: inventory-service
    ports:
      - "8083:8083"
    env_file:
      - ../.env
    environment:
      NEON_HOST: ${NEON_HOST}
      NEON_USER: ${NEON_USER}
      NEON_PASSWORD: ${NEON_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_USERNAME: ${KAFKA_USERNAME}
      KAFKA_PASSWORD: ${KAFKA_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_USERNAME: ${REDIS_USERNAME}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    mem_limit: 350m
    networks:
      - eventflow-net
    restart: unless-stopped

  shipping-service:
    profiles: ["core", "all"]
    build:
      context: ..
      dockerfile: shipping-service/Dockerfile
    container_name: shipping-service
    ports:
      - "8084:8084"
    env_file:
      - ../.env
    environment:
      NEON_HOST: ${NEON_HOST}
      NEON_USER: ${NEON_USER}
      NEON_PASSWORD: ${NEON_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_USERNAME: ${KAFKA_USERNAME}
      KAFKA_PASSWORD: ${KAFKA_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_USERNAME: ${REDIS_USERNAME}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    mem_limit: 350m
    networks:
      - eventflow-net
    restart: unless-stopped

  notification-service:
    profiles: ["core", "all"]
    build:
      context: ..
      dockerfile: notification-service/Dockerfile
    container_name: notification-service
    ports:
      - "8085:8085"
    env_file:
      - ../.env
    environment:
      NEON_HOST: ${NEON_HOST}
      NEON_USER: ${NEON_USER}
      NEON_PASSWORD: ${NEON_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_USERNAME: ${KAFKA_USERNAME}
      KAFKA_PASSWORD: ${KAFKA_PASSWORD}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
    mem_limit: 350m
    networks:
      - eventflow-net
    restart: unless-stopped

  # ─── Incident Analytics Services ────────────────────────
  incident-detector:
    profiles: ["ai", "all"]
    build:
      context: ..
      dockerfile: incident-detector/Dockerfile
    container_name: incident-detector
    ports:
      - "8092:8092"
    env_file:
      - ../.env
    environment:
      SERVER_PORT: "8092"
      NEON_HOST: ${NEON_HOST}
      NEON_USER: ${NEON_USER}
      NEON_PASSWORD: ${NEON_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_USERNAME: ${KAFKA_USERNAME}
      KAFKA_PASSWORD: ${KAFKA_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_USERNAME: ${REDIS_USERNAME}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    mem_limit: 350m
    networks:
      - eventflow-net
    restart: unless-stopped

  incident-analyzer:
    profiles: ["ai", "all"]
    build:
      context: ..
      dockerfile: incident-analyzer/Dockerfile
    container_name: incident-analyzer
    ports:
      - "8093:8093"
    env_file:
      - ../.env
    environment:
      SERVER_PORT: "8093"
      NEON_HOST: ${NEON_HOST}
      NEON_USER: ${NEON_USER}
      NEON_PASSWORD: ${NEON_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_USERNAME: ${KAFKA_USERNAME}
      KAFKA_PASSWORD: ${KAFKA_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_USERNAME: ${REDIS_USERNAME}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      CHROMADB_HOST: ${CHROMADB_HOST:-localhost}
      CHROMADB_PORT: ${CHROMADB_PORT:-8000}
    mem_limit: 350m
    networks:
      - eventflow-net
    restart: unless-stopped

  incident-query:
    profiles: ["ai", "all"]
    build:
      context: ..
      dockerfile: incident-query/Dockerfile
    container_name: incident-query
    ports:
      - "8091:8091"
    env_file:
      - ../.env
    environment:
      NEON_HOST: ${NEON_HOST}
      NEON_USER: ${NEON_USER}
      NEON_PASSWORD: ${NEON_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_USERNAME: ${REDIS_USERNAME}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CHROMADB_HOST: ${CHROMADB_HOST:-localhost}
      CHROMADB_PORT: ${CHROMADB_PORT:-8000}
    mem_limit: 350m
    networks:
      - eventflow-net
    restart: unless-stopped

  dashboard:
    profiles: ["core", "ai", "all"]
    build:
      context: ../dashboard
      dockerfile: Dockerfile
    container_name: incident-dashboard
    ports:
      - "3000:80"
    mem_limit: 50m
    networks:
      - eventflow-net
    restart: unless-stopped

networks:
  eventflow-net:
    driver: bridge

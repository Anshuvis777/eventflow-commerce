spring:
  datasource:
    url: jdbc:postgresql://${NEON_HOST:postgres}:5432/incident_analytics?sslmode=require&ssl=true
    username: ${NEON_USER:neondb_owner}
    password: ${NEON_PASSWORD:eventflow_secret}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:default}
      password: ${REDIS_PASSWORD:}

chromadb:
  base-url: http://${CHROMADB_HOST:chromadb}:${CHROMADB_PORT:8000}
